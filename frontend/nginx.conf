server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: every non-file route falls back to index.html so deep links
    # (/patients/42, /hospitals, ...) survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: the browser talks only to this host, nginx forwards to
    # the Ocelot gateway. Keeping one origin means the httpOnly refresh-token
    # cookie needs no cross-site (SameSite=None) handling and CORS never fires.
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Container orchestrator probes (compose healthcheck / k8s ingress checks).
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed build artifacts are immutable; index.html must always revalidate
    # so a new deployment is picked up immediately.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
