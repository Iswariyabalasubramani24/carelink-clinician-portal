<header class="app-header">
  <h1>{{ 'app.title' | translate }}</h1>
  <nav class="app-header__nav" *ngIf="currentClinician$ | async">
    <a routerLink="/dashboard" routerLinkActive="app-header__nav-link--active" class="app-header__nav-link">
      {{ 'nav.dashboard' | translate }}
    </a>
    <a routerLink="/patients" routerLinkActive="app-header__nav-link--active" class="app-header__nav-link">
      {{ 'nav.patients' | translate }}
    </a>
  </nav>
  <div class="app-header__actions">
    <app-language-switcher *ngIf="!(isLoginRoute$ | async)"></app-language-switcher>
    <div class="app-header__session" *ngIf="currentClinician$ | async as clinician">
      <app-clinic-switcher></app-clinic-switcher>
      <span class="app-header__clinician">{{ clinician.firstName }} {{ clinician.lastName }}</span>
      <button type="button" class="logout-btn" (click)="onLogout()">{{ 'app.logout' | translate }}</button>
    </div>
  </div>
</header>
<main>
  <router-outlet />
</main>
