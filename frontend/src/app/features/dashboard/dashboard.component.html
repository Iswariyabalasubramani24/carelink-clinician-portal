<div class="dashboard-page">
  <header class="dashboard-page__header">
    <h1>{{ 'dashboard.title' | translate }}</h1>
    <p class="subtitle">{{ 'dashboard.subtitle' | translate }}</p>
  </header>

  <p class="state-message" *ngIf="loading">{{ 'dashboard.loading' | translate }}</p>
  <p class="state-message state-message--error" *ngIf="error">{{ 'dashboard.loadError' | translate }}</p>

  <div class="widget-grid" *ngIf="summary as s">
    <button type="button" class="widget-card" (click)="goToPatients()">
      <div class="widget-card__header">
        <span class="widget-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <line x1="19" y1="8" x2="19" y2="14" />
            <line x1="22" y1="11" x2="16" y2="11" />
          </svg>
        </span>
        <span class="widget-card__label">{{ 'dashboard.newPatients' | translate }}</span>
      </div>
      <span class="widget-card__count">{{ s.newPatientsCount }}</span>
    </button>

    <button type="button" class="widget-card widget-card--warning" (click)="goToPatients()">
      <div class="widget-card__header">
        <span class="widget-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="2" x2="22" y2="22" />
            <path d="M8.5 16.5a5 5 0 0 1 7 0" />
            <path d="M5 12.9a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.9a10 10 0 0 0-2.6-1.9" />
            <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.9" />
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
            <line x1="12" y1="20" x2="12.01" y2="20" />
          </svg>
        </span>
        <span class="widget-card__label">{{ 'dashboard.disconnectedMonitors' | translate }}</span>
      </div>
      <span class="widget-card__count">{{ s.disconnectedMonitorsCount }}</span>
    </button>

    <button type="button" class="widget-card" (click)="goToPatients()">
      <div class="widget-card__header">
        <span class="widget-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        </span>
        <span class="widget-card__label">{{ 'dashboard.totalActivePatients' | translate }}</span>
      </div>
      <span class="widget-card__count">{{ s.totalActivePatientsCount }}</span>
    </button>

    <button type="button" class="widget-card widget-card--warning" (click)="goToPatients()">
      <div class="widget-card__header">
        <span class="widget-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
        </span>
        <span class="widget-card__label">{{ 'dashboard.activeAlerts' | translate }}</span>
      </div>
      <span class="widget-card__count">{{ s.activeAlertsCount }}</span>
    </button>
  </div>
</div>
