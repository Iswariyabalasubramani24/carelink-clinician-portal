<div class="login-page">
  <div class="login-card">
    <div class="login-card__brand">
      <h1>{{ 'login.brand' | translate }}</h1>
      <p class="subtitle">{{ 'login.subtitle' | translate }}</p>
    </div>

    <app-country-language-selector></app-country-language-selector>

    <div class="banner banner--info" *ngIf="idleSignedOut">
      <span class="banner__icon">i</span>
      {{ 'login.idleSignedOut' | translate }}
    </div>

    <div class="banner banner--error" *ngIf="errorMessage">
      <span class="banner__icon">!</span>
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-field">
        <label for="email">{{ 'login.email' | translate }}</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" />
        <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
          {{ 'login.emailRequired' | translate }}
        </span>
        <span class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
          {{ 'login.emailInvalid' | translate }}
        </span>
      </div>

      <div class="form-field">
        <label for="password">{{ 'login.password' | translate }}</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
        <span class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">
          {{ 'login.passwordRequired' | translate }}
        </span>
      </div>

      <button type="submit" class="btn btn--primary btn--block" [disabled]="loading">
        {{ (loading ? 'login.signingIn' : 'login.signIn') | translate }}
      </button>
    </form>
  </div>
</div>
