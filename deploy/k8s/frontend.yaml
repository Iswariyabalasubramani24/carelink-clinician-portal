apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: carelink
  labels:
    app: frontend
    app.kubernetes.io/part-of: carelink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: carelink-frontend:latest # tag substituted by the CD pipeline
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: carelink
  labels:
    app: frontend
    app.kubernetes.io/part-of: carelink
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
