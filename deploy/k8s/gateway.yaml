apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: carelink
  labels:
    app: gateway
    app.kubernetes.io/part-of: carelink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: carelink-gateway:latest # tag substituted by the CD pipeline
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production" # loads ocelot.Production.json (routes to api:8080)
            - name: OTEL_SERVICE_NAME
              value: carelink-gateway # cloud role name in Application Insights
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true # telemetry off when absent
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway # must stay "gateway" - the frontend nginx proxies /api to gateway:8080
  namespace: carelink
  labels:
    app: gateway
    app.kubernetes.io/part-of: carelink
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
