# In-cluster SQL Server for self-hosted clusters. On Azure, PREFER Azure SQL:
# point ConnectionStrings__DefaultConnection (in carelink-secrets) at the
# managed instance and remove this file from kustomization.yaml - patient data
# belongs on a managed, backed-up database service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: carelink
  labels:
    app: sqlserver
    app.kubernetes.io/part-of: carelink
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Express"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carelink-secrets
                  key: MSSQL_SA_PASSWORD
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
            initialDelaySeconds: 40
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: mssql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver # must stay "sqlserver" - the default connection string targets sqlserver,1433
  namespace: carelink
  labels:
    app: sqlserver
    app.kubernetes.io/part-of: carelink
spec:
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
