apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: carelink
  labels:
    app: api
    app.kubernetes.io/part-of: carelink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: carelink-api:latest # tag substituted by the CD pipeline (kustomize edit set image)
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: carelink-api # cloud role name in Application Insights
          envFrom:
            - configMapRef:
                name: carelink-config
            - secretRef:
                name: carelink-secrets
          # Liveness deliberately checks nothing but the process (a slow DB
          # must not get a healthy pod killed); readiness gates on real
          # dependencies so traffic only reaches pods that can serve it.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api # must stay "api" - ocelot.Production.json routes to api:8080
  namespace: carelink
  labels:
    app: api
    app.kubernetes.io/part-of: carelink
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
