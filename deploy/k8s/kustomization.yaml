apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - sqlserver.yaml # remove when using a managed database (e.g. Azure SQL)
  - redis.yaml
  - api.yaml
  - gateway.yaml
  - frontend.yaml
  - ingress.yaml
# carelink-secrets is applied out-of-band (see secret.example.yaml) or created
# by the CD pipeline from secure variables - never from a committed file.

# The CD pipeline pins real registry/tag values here, e.g.:
#   kustomize edit set image carelink-api=myacr.azurecr.io/carelink-api:20260721.1
images:
  - name: carelink-api
  - name: carelink-gateway
  - name: carelink-frontend
