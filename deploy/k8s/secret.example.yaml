# TEMPLATE ONLY - copy, fill in, and apply out-of-band (or let the CD pipeline
# create it from secure variables). Never commit a filled-in copy.
#
#   kubectl apply -f secret.yaml   (your filled-in copy, NOT this file)
#
# On Azure, prefer pointing DefaultConnection at Azure SQL and dropping the
# in-cluster sqlserver StatefulSet entirely.
apiVersion: v1
kind: Secret
metadata:
  name: carelink-secrets
  namespace: carelink
  labels:
    app.kubernetes.io/part-of: carelink
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CareLinkCleanArch;User Id=sa;Password=<MSSQL_SA_PASSWORD>;TrustServerCertificate=True"
  Jwt__Secret: "<openssl rand -base64 48>"
  SuperAdmin__Email: "<platform operator email>"
  SuperAdmin__Password: "<strong password>"
  MSSQL_SA_PASSWORD: "<MSSQL_SA_PASSWORD>"
  # Optional - omit the key entirely to run without telemetry.
  APPLICATIONINSIGHTS_CONNECTION_STRING: "<Application Insights connection string>"
