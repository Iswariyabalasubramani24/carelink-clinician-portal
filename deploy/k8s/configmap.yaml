apiVersion: v1
kind: ConfigMap
metadata:
  name: carelink-config
  namespace: carelink
  labels:
    app.kubernetes.io/part-of: carelink
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  # A fresh pod migrates the schema before seeding; migrations are idempotent
  # and EF takes a distributed migration lock, so parallel pods are safe.
  Database__MigrateOnStartup: "true"
  ConnectionStrings__Redis: "redis:6379"
